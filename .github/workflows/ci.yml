name: Python CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install research package
        run: python -m pip install -e '.[dev]'
      - name: Run unit tests
        run: python -m pytest -q
      - name: Verify CLI commands
        run: |
          eco-cps simulate --config configs/baseline.json --policy fixed
          eco-cps simulate --config configs/baseline.json --policy joint
          eco-cps benchmark --config configs/baseline.json --seeds 7 17 --out results/ci
          eco-cps report --input results/ci
